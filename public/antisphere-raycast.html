<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antisphere ray caster</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7f8a99; letter-spacing: 0.02em; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  #hud b { color: #cbd5e1; font-weight: 500; }
  #note { display: inline-block; min-height: 1.6em; }
  #prof {
    position: fixed; right: 14px; top: 14px;
    min-width: 15rem; padding: 10px 12px;
    background: rgba(10,13,17,.82); border: 1px solid #1e2530; border-radius: 8px;
    font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; color: #8b95a5;
    backdrop-filter: blur(6px);
  }
  #prof .r { display: flex; justify-content: space-between; gap: 2em; }
  #prof .r b { color: #cbd5e1; font-weight: 500; font-variant-numeric: tabular-nums; }
  #prof hr { border: 0; border-top: 1px solid #1e2530; margin: 7px 0; }
  #prof .note { color: #6b7686; }
  #prof .spark { display: block; margin: 6px 0; width: 100%; height: 40px; }
  #prof .lad-bar { display: flex; height: 10px; margin: 6px 0; border-radius: 3px; overflow: hidden; background: #161b22; }
  #prof .lad-bar span { display: block; height: 100%; }
  #prof .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  #probe {
    position: fixed; left: 14px; top: 12px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7f8a99; letter-spacing: 0.02em; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  #probe b { color: #cbd5e1; font-weight: 500; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 9px; height: 9px;
    margin: -5px 0 0 -5px; pointer-events: none;
    background:
      linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.7)) center / 1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.7)) center / 100% 1px no-repeat;
    mix-blend-mode: difference;
  }
  #err {
    position: fixed; inset: 0; display: none; place-content: center;
    padding: 2rem; text-align: center; white-space: pre-wrap; max-width: 46rem;
    margin: 0 auto;
    font: 14px/1.7 ui-monospace, Menlo, monospace; color: #e2e8f0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe">object <b id="probe-object">-</b><br>material <b id="probe-material">-</b></div>
<div id="crosshair"></div>
<div id="hud"><b id="stat">starting…</b><br>orbit: drag to look · wheel to zoom<br>free/walk: mouse looks, click to grab it · &uarr;&darr; move<br>M camera mode · C reset camera · S shadows · I what's at the centre<br>R reload · W watch · P profiler · A ablation (⇧ forces full)<br>D debug view · B blit/direct · [ ] render scale<br><span id="note"></span></div>
<div id="prof"><div id="prof-panel"></div><hr><div id="ladder"></div></div>
<div id="err"></div>

<script type="module">
// The profiling view: one renderer, one camera, the frame profiler
// (frame-profiler.js) and the ablation ladder (ablation-ladder.js). It
// drives its own frame loop rather than using ASContext.start(), because
// profiling needs to inject timestampWrites into the encode and resolve the
// query set before the submit. Everything else here is the library doing
// the work.

import { ASContext } from './as-context.js';
import { ASRenderer, DEBUG_VIEWS } from './as-renderer.js';
import { ASCamera, attachCameraControls } from './as-camera.js';
import { loadText, loadBytes } from './gpu-setup.js';
import { FrameProfiler } from './frame-profiler.js';
import { AblationLadder } from './ablation-ladder.js';
import { loadReferences } from './antisphere-scene.js';

const canvas = document.getElementById('c');
const el = (id) => document.getElementById(id);

function fail(msg) {
  el('err').style.display = 'grid';
  el('err').textContent = msg;
  canvas.style.display = 'none';
}

let noteTimer = 0;
function note(text, bad) {
  el('note').textContent = text;
  el('note').style.color = bad ? '#f87171' : '#4ade80';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { el('note').textContent = ''; }, bad ? 6000 : 1600);
}

main().catch((e) => { fail(e.message); throw e; });

async function main() {
  // ?scene=other.json picks a different scene, so a benchmark setup is a
  // shareable URL rather than an edit. A full URL loads from anywhere that
  // allows it (CORS), and an .stl, there or here, is shown on its own.
  const sceneFile = new URLSearchParams(location.search).get('scene') || 'scene.json';
  const scenePath = /^[a-z][a-z0-9+.-]*:\/\//i.test(sceneFile) ? sceneFile : `scenes/${sceneFile}`;

  const gpu = await ASContext.create({ 'computeUrl': 'gen/antisphere-raycast.wgsl' });
  const scene = await gpu.loadScene(scenePath);
  const camera = new ASCamera();
  const view = gpu.createRenderer(canvas, { scene, camera });
  view.useSceneCamera();

  logSceneSize(scene);

  // -----------------------------------------------------------------------
  // Profiling
  //
  // GPU timestamps can only be written at pass boundaries, so what is
  // measured here is the compute pass and the blit pass, and the gap
  // between. Anything finer comes from the shader's per-invocation work
  // counters, surfaced as debug views, and from the ablation ladder (A).
  // Shown from the start; hidden (P), and no ladder running, nothing is
  // timed.
  // -----------------------------------------------------------------------

  const profiler = new FrameProfiler(gpu.device, gpu.canTimestamp, ['compute', 'blit'], el('prof-panel'),
                                     { enabled: () => !el('prof').hidden || ladder.running });
  const ladder = new AblationLadder(profiler, el('ladder'), { pass: 'compute' });

  // -----------------------------------------------------------------------
  // Input
  // -----------------------------------------------------------------------

  const controls = attachCameraControls(canvas, camera, {
    onNote: note,
    // Frozen during a ladder run so the view can't move mid-measurement.
    enabled: () => !ladder.running,
    probe: (origin, direction) => scene.traceRay(origin, direction),
  });

  window.addEventListener('keydown', (e) => {
    switch (e.key.toLowerCase()) {
      case 's':
        view.shadows = !view.shadows;
        note(`shadows ${view.shadows ? 'on' : 'off'}`);
        break;
      case 'd': note(`view: ${view.cycleDebugView()}`); break;
      case 'b':
        if (!view.canDirect) { note('direct output unavailable on this adapter', true); break; }
        view.setDirectOut(!view.directOut);
        note(view.directOut
          ? `output: direct to swap chain${view.renderScale !== 1 ? ' (ignores render scale)' : ''}`
          : 'output: blit');
        break;
      case 'm': note(`camera: ${controls.cycleMode()}`); break;
      case 'c':
        view.useSceneCamera();
        controls.setMode('orbit');
        note('camera reset to scene viewpoint');
        break;
      case '[': case ']': {
        const s = view.setRenderScale(view.renderScale + (e.key === ']' ? 0.1 : -0.1));
        note(`render scale ${s.toFixed(2)} (${view.renderWidth}x${view.renderHeight})`);
        break;
      }
      case 'r': reload(true); break;
      case 'w':
        watching = !watching;
        note(watching ? 'watching files for changes' : 'watch off');
        break;
      case 'p':
        el('prof').hidden = !el('prof').hidden;
        break;
      case 'i':
        probing = !probing;
        el('probe').hidden = el('crosshair').hidden = !probing;
        break;
      case 'a':
        // A run profiles the view as it is; shift forces the shadow-ray rung.
        if (!gpu.canTimestamp) note('ablation needs timestamp-query', true);
        else if (ladder.running) ladder.cancel();
        else {
          el('prof').hidden = false;
          ladder.start({ shadows: view.shadows, force: e.shiftKey, label: view.directOut ? 'direct' : 'blit' });
        }
        break;
      default: return;
    }
  });

  // -----------------------------------------------------------------------
  // Hot reload
  //
  // Shaders rebuild through the context; the scene is refetched here so its
  // text can be compared for the watch poll. A failed rebuild is reported and
  // the previous pipelines keep rendering.
  // -----------------------------------------------------------------------

  // -----------------------------------------------------------------------
  // What's at the centre
  //
  // Each frame a ray down the middle of the view (the crosshair) asks what it
  // hits: the object the node came from, and the node's material. The answer
  // is a frame or two behind, and one ray is in flight at a time. Off during
  // an ablation run, so it measures the renderer alone.
  // -----------------------------------------------------------------------

  let probing = true, probeInFlight = false;
  function probeCentre() {
    if (!probing || probeInFlight || ladder.running) return;
    probeInFlight = true;
    const { eye, forward } = camera.basis();
    scene.pick(eye, forward).then((hit) => {
      const prov = hit && scene.provenance?.[hit.node];
      const where = !hit ? 'nothing'
        : !prov ? `node ${hit.node} (the compiler's)`
        : prov.owner === '@root' ? `root${prov.path ? ` / ${prov.path}` : ''}`
        : `${prov.owner}${prov.path ? ` / ${prov.path}` : ''}`;
      const material = hit ? scene.materials[scene.nodes[hit.node]?.material] : null;
      el('probe-object').textContent = where;
      el('probe-material').textContent = !hit ? '-'
        : material?.missing ? `${material.name} (not defined: a stand-in)` : material?.name ?? '(none)';
    }, () => {}).finally(() => { probeInFlight = false; });
  }

  let liveScene = await loadText(scenePath);
  let reloading = false;
  let watching = false;      // polling is opt-in; R reloads on demand

  async function reload(force) {
    if (reloading) return;
    reloading = true;
    try {
      const done = [];
      const shaders = await gpu.reloadShaders({ force });
      if (shaders.error) { note(`reload: ${shaders.error}`, true); return; }
      if (shaders.changed) done.push('shaders');

      const text = await loadText(scenePath);
      if (force || text !== liveScene) {
        // Record the new text either way, so a broken file is not retried on
        // every poll.
        liveScene = text;
        try {
          // What it references is reloaded too: it may have changed, or be new.
          const spec = JSON.parse(text);
          scene.update(spec, { files: await loadReferences(spec, { from: scenePath, readText: loadText, readBytes: loadBytes }) });
          logSceneSize(scene);
          done.push('scene');
        } catch (err) {
          note(`reload: ${err.message}`, true);
          return;
        }
      }
      if (done.length) note(`reloaded ${done.join(' and ')}`);
    } catch (err) {
      note(`reload: ${err.message}`, true);
    } finally {
      reloading = false;
    }
  }

  setInterval(() => { if (watching) reload(false); }, 1500);

  // Compiled scene size, in nodes/materials/lights and packed bytes, for
  // comparing tree-shape and encoding changes across branches. Byte counts
  // matter alongside node counts because a node's own packed size isn't
  // guaranteed constant across branches.
  function logSceneSize(s) {
    console.log(
      `scene size: ${s.nodes.length} nodes · ${s.materials.length} materials · ` +
      `${s.lights.length} lights · total ${s.bytes} B`);
  }

  // -----------------------------------------------------------------------
  // Frame
  // -----------------------------------------------------------------------

  let tLast = performance.now(), tStat = 0;

  function frame() {
    requestAnimationFrame(frame);

    const now = performance.now();
    const frameMs = now - tLast;
    tLast = now;

    controls.update(Math.min(0.1, frameMs / 1000));   // clamp after a stall

    // Tagged with the rung it samples, if a ladder is running (-1 warming up).
    profiler.begin(ladder.tag());
    const cpuStart = performance.now();

    // Direct output writes no blit pass: idle, so it shows no time.
    if (view.directOut) profiler.idle('blit');
    // The ladder drives the shadow flag, the ablation level and the debug view
    // through the encode rather than by mutating the renderer, so a run leaves
    // the user's own settings alone.
    const enc = gpu.device.createCommandEncoder();
    const drew = view.encode(enc, {
      camera: ladder.override(),
      computeTimestamps: profiler.pass('compute'),
      blitTimestamps: view.directOut ? undefined : profiler.pass('blit'),
    });
    if (!drew) { profiler.skipped('compute'); profiler.skipped('blit'); }
    profiler.resolve(enc);
    gpu.device.queue.submit([enc.finish()]);

    profiler.extra = {
      view: DEBUG_VIEWS[view.debugView],
      output: view.directOut ? 'direct' : 'blit',
      'rays/frame': `${(view.pixelCount / 1e6).toFixed(2)} M`,
    };
    profiler.end(frameMs, performance.now() - cpuStart);

    ladder.frame();
    probeCentre();

    if (now - tStat > 500) {
      tStat = now;
      const full = view.renderWidth === view.width && view.renderHeight === view.height;
      const res = full
        ? `${view.width}x${view.height}`
        : `${view.width}x${view.height} (render ${view.renderWidth}x${view.renderHeight})`;
      el('stat').textContent =
        `${scene.nodes.length} nodes · ${scene.materials.length - 1} materials · ` +
        `${scene.lights.length} lights · ${res}`;
    }
  }
  requestAnimationFrame(frame);

  Object.assign(window, { gpu, scene, view, camera, controls, profiler, ladder });
}
</script>
</body>
</html>
